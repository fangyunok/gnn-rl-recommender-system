services:
  - type: web
    name: gnn-rl-recommender-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATASET
        value: movielens
      - key: MODEL_DIR
        value: /app/artifacts
      - key: POLICY_WEIGHT
        value: "0.2"
    autoDeployTrigger: commit

